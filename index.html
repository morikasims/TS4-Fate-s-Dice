<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-80F6YZDDL7"></script>

    <!-- Microsoft Clarity -->
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "yokrxe1d9q");

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колесо Фортуны — Симы</title>
    <link rel="icon" type="image/png" href="dsf.png">
    <link rel="apple-touch-icon" href="dsf.png">

    <style>
        :root {
            --bg-color: #f6f0ea;
            --container-bg: #ffffff;
            --text-color: #4a403a;
            --accent-color: #d48375;
            --accent-hover: #bc6d60;
            --border-color: #e3d5cb;
            --panel-bg: #fdf8f5;
            --shadow: 0 12px 35px rgba(107, 93, 85, 0.1);
            --author-bg: #ffffff;
            --author-border: #e3d5cb;
        }

        body.theme-focus {
            --bg-color: #f0f2f5;
            --container-bg: #ffffff;
            --text-color: #434857;
            --accent-color: #8c82db;
            --accent-hover: #7368c7;
            --border-color: #d8dce6;
            --panel-bg: #f7f8fc;
            --shadow: 0 12px 35px rgba(115, 104, 199, 0.12);
            --author-bg: #ffffff;
            --author-border: #d8dce6;
        }

        body.theme-forest {
            --bg-color: #f0f4f1;
            --container-bg: #ffffff;
            --text-color: #3b4640;
            --accent-color: #729a83;
            --accent-hover: #5d826d;
            --border-color: #d2ded7;
            --panel-bg: #f5f9f6;
            --shadow: 0 12px 35px rgba(93, 130, 109, 0.1);
            --author-bg: #ffffff;
            --author-border: #d2ded7;
        }

        body.theme-dark {
            --bg-color: #16181c;
            --container-bg: #21242c;
            --text-color: #e4e6eb;
            --accent-color: #d68276;
            --accent-hover: #bd695d;
            --border-color: #323742;
            --panel-bg: #282c35;
            --shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
            --author-bg: #21242c;
            --author-border: #323742;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .author-badge {
            position: fixed;
            left: 25px;
            bottom: 25px;
            background: var(--author-bg);
            border: 1px solid var(--author-border);
            padding: 10px 16px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            z-index: 50;
            text-decoration: none;
            color: var(--text-color);
        }

        .author-badge:hover {
            border-color: var(--accent-color);
        }

        .author-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #8c7b73;
            font-weight: 700;
        }

        body.theme-dark .author-title {
            color: #9e9590;
        }

        .author-link {
            font-weight: 600;
            color: var(--accent-color);
        }

        @media (max-width: 850px) {
            .author-badge {
                position: static;
                margin-top: 20px;
                width: 100%;
                max-width: 580px;
                align-items: center;
                text-align: center;
            }
        }

        .wrapper {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 30px 35px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 580px;
            width: 100%;
            position: relative;
        }

        .settings-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
        }

        .settings-btn:hover {
            transform: rotate(30deg);
        }

        .settings-menu {
            position: absolute;
            top: 75px;
            right: 25px;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow);
            text-align: left;
            width: 335px;
            display: none;
            z-index: 30;
            max-height: 80vh;
            overflow-y: auto;
        }

        .settings-menu.active {
            display: block;
        }

        .settings-title {
            font-size: 12px;
            font-weight: 700;
            color: #8c7b73;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
            margin-top: 14px;
        }

        body.theme-dark .settings-title {
            color: #9e9590;
        }

        .settings-title:first-child {
            margin-top: 0;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            margin-bottom: 8px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label.sub-option {
            margin-left: 18px;
            font-size: 12px;
            opacity: 0.9;
        }

        .checkbox-label input {
            accent-color: var(--accent-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .theme-select, .preset-select {
            width: 100%;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--panel-bg);
            color: var(--text-color);
            font-size: 13px;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .custom-event-input, .sim-input-field {
            width: 100%;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--panel-bg);
            color: var(--text-color);
            font-size: 13px;
            margin-bottom: 6px;
        }

        .custom-event-input {
            resize: vertical;
            min-height: 45px;
        }

        .add-event-btn, .preset-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 4px;
        }

        .add-event-btn:hover, .preset-btn:hover {
            background: var(--accent-hover);
        }

        .preset-delete-btn {
            background: transparent;
            color: #b89c94;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 5px 12px;
            font-size: 11px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 4px;
        }

        .preset-delete-btn:hover {
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .preset-file-actions {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }

        .preset-file-btn {
            flex: 1;
            background: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .preset-file-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .custom-events-manage-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 140px;
            overflow-y: auto;
            margin-top: 6px;
            margin-bottom: 6px;
        }

        .custom-event-manage-item {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .custom-event-manage-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-grow: 1;
        }

        .custom-event-delete-single {
            background: none;
            border: none;
            color: #b89c94;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            padding: 0 4px;
        }

        .custom-event-delete-single:hover {
            color: var(--accent-color);
        }

        .site-logo {
            width: 54px;
            height: 54px;
            object-fit: contain;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.08));
        }

        h1 {
            font-size: 23px;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #8c7b73;
            margin-bottom: 20px;
        }

        body.theme-dark .subtitle {
            color: #9e9590;
        }

        .family-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .family-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .family-title {
            font-size: 12px;
            font-weight: 600;
            color: #8c7b73;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        body.theme-dark .family-title {
            color: #9e9590;
        }

        .random-sim-btn {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-color);
            cursor: pointer;
        }

        .random-sim-btn:hover {
            border-color: var(--accent-color);
        }

        .sims-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .sim-card {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            position: relative;
        }

        .sim-card:hover {
            border-color: var(--accent-color);
        }

        .sim-card.disabled {
            opacity: 0.4;
            filter: grayscale(1);
        }

        .sim-delete-btn {
            position: absolute;
            top: 2px;
            right: 4px;
            background: none;
            border: none;
            font-size: 10px;
            color: #b89c94;
            cursor: pointer;
        }

        .sim-delete-btn:hover {
            color: var(--accent-color);
        }

        .sim-avatar {
            font-size: 20px;
            margin-bottom: 2px;
        }

        .sim-name {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .sim-action-btn {
            background: var(--bg-color);
            border: none;
            border-radius: 6px;
            padding: 3px 4px;
            font-size: 9px;
            color: var(--text-color);
            cursor: pointer;
            font-weight: 500;
            width: 100%;
        }

        .sim-action-btn:hover {
            background: var(--accent-color);
            color: white;
        }

        .counter-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 14px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .counter-value {
            font-weight: 700;
            color: var(--accent-color);
            font-size: 15px;
        }

        .reset-counter-btn {
            background: none;
            border: none;
            color: #8c7b73;
            font-size: 11px;
            cursor: pointer;
            text-decoration: underline;
        }

        body.theme-dark .reset-counter-btn {
            color: #9e9590;
        }

        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto 20px auto;
        }

        .pointer {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 24px solid var(--accent-color);
            z-index: 20;
            filter: drop-shadow(0 3px 4px rgba(0,0,0,0.15));
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 7px solid var(--border-color);
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.15, 0.8, 0.15, 1);
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            background: conic-gradient(
                #d48375 0deg 45deg,
                #e0a96d 45deg 90deg,
                #e3c37d 90deg 135deg,
                #7b9e89 135deg 180deg,
                #6b8cae 180deg 225deg,
                #9b7bb4 225deg 270deg,
                #c4769c 270deg 315deg,
                #d99b82 315deg 360deg
            );
        }

        .wheel-slice-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .slice-label {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            margin-top: -20px;
            margin-left: -20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transform-origin: center center;
        }

        .slice-label:nth-child(1) { transform: rotate(22.5deg) translate(0, -88px) rotate(-22.5deg); }
        .slice-label:nth-child(2) { transform: rotate(67.5deg) translate(0, -88px) rotate(-67.5deg); }
        .slice-label:nth-child(3) { transform: rotate(112.5deg) translate(0, -88px) rotate(-112.5deg); }
        .slice-label:nth-child(4) { transform: rotate(157.5deg) translate(0, -88px) rotate(-157.5deg); }
        .slice-label:nth-child(5) { transform: rotate(202.5deg) translate(0, -88px) rotate(-202.5deg); }
        .slice-label:nth-child(6) { transform: rotate(247.5deg) translate(0, -88px) rotate(-247.5deg); }
        .slice-label:nth-child(7) { transform: rotate(292.5deg) translate(0, -88px) rotate(-292.5deg); }
        .slice-label:nth-child(8) { transform: rotate(337.5deg) translate(0, -88px) rotate(-337.5deg); }

        .spin-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 13px 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .spin-btn:hover {
            background-color: var(--accent-hover);
        }

        .spin-btn:disabled {
            background-color: #d0c5bf;
            cursor: not-allowed;
        }

        .history-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 16px;
            text-align: left;
        }

        .history-title {
            font-size: 11px;
            font-weight: 700;
            color: #8c7b73;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        body.theme-dark .history-title {
            color: #9e9590;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 110px;
            overflow-y: auto;
        }

        .history-item {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .history-tag {
            font-weight: 700;
            color: var(--accent-color);
            font-size: 10px;
            text-transform: uppercase;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(74, 64, 58, 0.45);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            padding: 32px;
            border-radius: 24px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .modal-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #8c7b73;
            margin-bottom: 10px;
            font-weight: 700;
        }

        body.theme-dark .modal-title {
            color: #9e9590;
        }

        .modal-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .modal-btn {
            background-color: var(--text-color);
            color: var(--container-bg);
            border: none;
            border-radius: 12px;
            padding: 11px 26px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
